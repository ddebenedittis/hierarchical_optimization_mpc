services:
  ho_mpc:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BASE_IMAGE: osrf/ros
        BASE_TAG: humble-desktop
        ROS_NUMBER: 2
        USER: ${USER}
        PWDR: ${PWD}
        FFMPEG: ${FFMPEG:-0}
        LATEX: ${LATEX:-0}
        TORCH: ${TORCH:-0}
    image: ho_mpc
    container_name: ho_mpc
    stdin_open: true
    tty: true
    command: bash
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, graphics, compute, utility]
    volumes:
      # X11
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth.file:/tmp/.docker.xauth
      - /dev/dri:/dev/dri
      # Project directory
      - ${PWD}:${PWD}
      # Bash history
      - ~/.bash_history:/home/.bash_history
      # PulseAudio
      - ${XDG_RUNTIME_DIR}/pulse/native:${XDG_RUNTIME_DIR}/pulse/native
      # Shared memory (ROS 2 DDS)
      - /dev/shm:/dev/shm
      # VS Code
      - /home/${USER}/.vscode:/home/${USER}/.vscode
      - /home/${USER}/.vscode-server:/home/${USER}/.vscode-server
      - /home/${USER}/.config/Code:/home/${USER}/.config/Code
    devices:
      - /dev/snd:/dev/snd
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/tmp/.docker.xauth
      - HISTFILE=/home/.bash_history
      - PULSE_SERVER=unix:${XDG_RUNTIME_DIR}/pulse/native
    group_add:
      - ${AUDIO_GID:-29}
